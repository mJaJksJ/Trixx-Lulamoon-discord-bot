name: CI/CD Pipeline

on:
  workflow_dispatch:

jobs:
  ci-cd:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Setup .NET
      uses: actions/setup-dotnet@v3
      with:
        dotnet-version: 8.0.x

    - name: Setup Node.js
      uses: actions/setup-node@v3
      with:
        node-version: 20

    - name: Install Angular dependencies
      run: |
        cd trixxdiscordbot.client
        npm install

    - name: Build Angular
      run: |
        cd trixxdiscordbot.client
        npm run build

    - name: Build .NET backend
      run: |
        cd TrixxDiscordBot.Server
        dotnet restore
        dotnet build --configuration Release
        dotnet publish -c Release -o publish

    - name: Deploy to server
      uses: appleboy/ssh-action@v0.1.6
      with:
        host: ${{ secrets.SERVER_HOST }}
        username: ${{ secrets.SERVER_USER }}
        key: ${{ secrets.SERVER_SSH_KEY }}
        port: 22
        script: |
          mkdir -p /var/www/v2trixx
          rsync -avz --delete ./trixxdiscordbot.client/dist/ ~/trixxdiscordbot/client/
          rsync -avz --delete ./TrixxDiscordBot.Server/publish/ ~/trixxdiscordbot/server/
          # Перезапуск сервиса systemd
          sudo systemctl restart trixxdiscordbot